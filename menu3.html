<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        Contato - World Cup Store 2026
    </title>


    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">


    <link
    rel="stylesheet"
    href="assets/css/styles.css">

</head>

<body>


    <nav
    class="navbar navbar-expand-lg navbar-dark menu-principal">

        <div class="container">

            <a
            class="navbar-brand"
            href="index.html">

                🏆 World Cup Store 2026

            </a>

            <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

                <span
                class="navbar-toggler-icon">
                </span>

            </button>

            <div
            class="collapse navbar-collapse"
            id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                        class="nav-link"
                        href="index.html">

                            Início

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                        class="nav-link"
                        href="menu1.html">

                            História

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                        class="nav-link"
                        href="menu2.html">

                            Produtos

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                        class="nav-link active"
                        href="menu3.html">

                            Contato

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <section class="hero">

        <div class="container">

            <h1 class="titulo-principal">

                Entre em Contato

            </h1>

            <p class="subtitulo">

                Envie sua mensagem para nossa equipe

            </p>

        </div>

    </section>


    <section class="container mb-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="produto-card p-5">

                    <h2 class="text-primary fw-bold mb-4">

                        Formulário de Contato

                    </h2>

                    <form id="formContato">


                        <div class="mb-4">

                            <label
                            class="form-label text-dark fw-bold">

                                Nome Completo
                            </label>

                            <input
                            type="text"
                            class="form-control pesquisa"
                            placeholder="Digite seu nome"
                            required>

                        </div>


                        <div class="mb-4">

                            <label
                            class="form-label text-dark fw-bold">

                                Email
                            </label>

                            <input
                            type="email"
                            class="form-control pesquisa"
                            placeholder="Digite seu email"
                            required>

                        </div>


                        <div class="mb-4">

                            <label
                            class="form-label text-dark fw-bold">

                                Telefone
                            </label>

                            <input
                            type="tel"
                            class="form-control pesquisa"
                            placeholder="Digite seu telefone">

                        </div>


                        <div class="mb-4">

                            <label
                            class="form-label text-dark fw-bold">

                                Assunto
                            </label>

                            <input
                            type="text"
                            class="form-control pesquisa"
                            placeholder="Digite o assunto"
                            required>

                        </div>


                        <div class="mb-4">

                            <label
                            class="form-label text-dark fw-bold">

                                Mensagem
                            </label>

                            <textarea
                            class="form-control"
                            rows="6"
                            placeholder="Digite sua mensagem"
                            required>
                            </textarea>

                        </div>


                        <button
                        type="submit"
                        class="btn btn-primary w-100">

                            Enviar Mensagem

                        </button>

                    </form>


                    <div
                    id="mensagemSucesso"
                    class="alert alert-success mt-4 d-none">

                        Sua mensagem foi enviada com sucesso!

                    </div>

                </div>

            </div>

        </div>

    </section>


    <footer class="footer">

        <p>

            © 2026 World Cup Store 2026 - Todos os direitos reservados.

        </p>

    </footer>


    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <script>

        const formContato =
        document.getElementById("formContato")

        const mensagemSucesso =
        document.getElementById("mensagemSucesso")

        formContato.addEventListener("submit", function(event){

            event.preventDefault()

            mensagemSucesso.classList.remove("d-none")

            formContato.reset()

        })

    </script>

</body>

</html>
